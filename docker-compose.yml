services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # SQLite file — lives in ./data/ on the host (gitignored)
      DATABASE_URL: file:/data/db.sqlite
      # Change this to your server's address or domain
      BASE_URL: http://localhost:3000
    volumes:
      # Database — bind mount to ./data/ (not under public/, keeps it off the web)
      - ./data:/data
      # Uploads — bind mount to ./public/uploads/ (already gitignored, served as static files)
      - ./public/uploads:/app/public/uploads
    restart: unless-stopped
