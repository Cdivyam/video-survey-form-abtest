services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # SQLite file lives in the persisted data volume
      DATABASE_URL: file:/data/db.sqlite
      # Change this to your server's address or domain
      BASE_URL: http://localhost:3000
    volumes:
      # Persistent SQLite database
      - db_data:/data
      # Persistent uploaded and composite videos
      - uploads:/app/public/uploads
    restart: unless-stopped

volumes:
  db_data:
  uploads:
